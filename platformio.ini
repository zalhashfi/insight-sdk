[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
; Link the project's src/ .cpp translation units into the native test binary.
; Without this, PlatformIO excludes src/ from "test" build types, so any
; implementation living in a .cpp (e.g. InsightOta.cpp) would fail to link and
; a suite could only ever use header-only code. Existing suites are header-only
; and are unaffected; this simply makes non-header implementations testable.
test_build_src = true
