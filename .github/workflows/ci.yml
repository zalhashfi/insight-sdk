name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run native tests
        run: |
          set -o pipefail
          pio test -e native 2>&1 | tee /tmp/pio.log
          # Guard against false pass: `pio test -f <missing suite>` exits 0 with
          # "0 test cases: 0 succeeded". Require at least one executed test.
          grep -qE '[1-9][0-9]* test cases: [1-9][0-9]* succeeded' /tmp/pio.log

      - name: Build Blink for ESP32
        run: pio ci --board esp32dev --lib . examples/Blink

      - name: Build Blink for ESP8266
        run: pio ci --board nodemcuv2 --lib . examples/Blink
